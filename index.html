<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Modern E-Commerce</title>
    <meta name="description" content="Minimalist, high-performance e-commerce platform featuring seasonal collections, interactive sticky categories, guest & profile checkout, reviews, order tracking, and full admin management." />
    <meta name="keywords" content="minimalist fashion, sustainable knitwear, artisanal ceramics, leather goods, architectural lifestyle, modern ecommerce, carbon-neutral shipping" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lumina-studio.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="Lumina Studio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lumina Modern E-Commerce" />
    <meta property="og:description" content="Minimalist, high-performance e-commerce platform featuring seasonal collections, interactive sticky categories, guest & profile checkout, reviews, order tracking, and full admin management." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumina Modern E-Commerce" />
    <meta name="twitter:description" content="Minimalist, high-performance e-commerce platform featuring seasonal collections, interactive sticky categories, guest & profile checkout, reviews, order tracking, and full admin management." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1200&q=80" />

    <!-- JSON-LD Structured Data Schema for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://lumina-studio.com/#website",
          "url": "https://lumina-studio.com",
          "name": "Lumina Modern E-Commerce",
          "description": "Minimalist, high-performance e-commerce platform featuring seasonal collections, interactive sticky categories, and full order tracking.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://lumina-studio.com/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Store",
          "@id": "https://lumina-studio.com/#store",
          "name": "Lumina",
          "image": "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1200&q=80",
          "description": "Curated lifestyle atelier offering architectural apparel, artisanal ceramics, and Tuscan leather goods.",
          "priceRange": "$$",
          "paymentAccepted": "Cash, Credit Card, Apple Pay, Google Pay",
          "currenciesAccepted": "USD"
        }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#fdfdfd] text-slate-900 antialiased selection:bg-slate-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
